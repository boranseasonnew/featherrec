name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Build Windows setup
        shell: pwsh
        run: ./scripts/installer.ps1
      - name: Verify installation, icon and uninstall
        shell: pwsh
        run: ./tests/validate-installer.ps1
      - name: Package development binaries
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: featherrec-windows-x64-development
          path: |
            target/portable/*
            target/FeatherRec-Setup-*.exe
          retention-days: 14
      # Hosted runners cannot validate physical monitor/GPU capture. These artifacts
      # are development builds, not an automatically published official release.
